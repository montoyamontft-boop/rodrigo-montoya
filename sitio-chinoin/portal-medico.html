<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Médico · CHINOIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { min-height: 100svh; display: grid; grid-template-columns: 1.05fr 1fr; background: #fff; }
    .login-art {
      position: relative; overflow: hidden; isolation: isolate; color: #fff;
      padding: 40px clamp(28px, 4vw, 60px); display: flex; flex-direction: column; justify-content: space-between;
      background: var(--night);
    }
    .login-art .hero-bg { background: radial-gradient(80% 80% at 60% 55%, rgba(255, 138, 76, .95), rgba(239, 84, 34, .85) 30%, rgba(184, 40, 11, .6) 55%, transparent 82%), var(--night); }
    .login-art .back { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; color: rgba(255, 255, 255, .85); align-self: flex-start; padding: 10px 18px 10px 12px; border-radius: 999px; border: 1px solid var(--glass-line); backdrop-filter: blur(10px); transition: background .3s; }
    .login-art .back:hover { background: rgba(255, 255, 255, .12); }
    .login-art .back svg { transform: rotate(180deg); }
    .login-art h2 { margin: 0; font-weight: 500; font-size: clamp(40px, 4.6vw, 76px); letter-spacing: -.045em; line-height: .95; }
    .login-art h2 em { font-family: var(--serif); font-weight: 400; }
    .login-art p { margin: 18px 0 0; max-width: 38ch; color: rgba(255, 255, 255, .8); }

    .login-panel { display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(24px, 6vw, 96px); }
    .login-panel .logo { width: min(100%, 340px); height: auto; margin-bottom: clamp(36px, 6vh, 64px); animation: viewIn .8s var(--ease-out); }
    .login-panel h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(44px, 4.6vw, 64px); letter-spacing: -.02em; line-height: 1; color: var(--ink); }
    .login-panel .intro { margin: 16px 0 34px; color: var(--ink-2); max-width: 46ch; }
    .login-form { display: grid; gap: 20px; max-width: 520px; }
    .pw { position: relative; }
    .pw input { padding-right: 96px; }
    .pw button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 14px; color: var(--purple); }
    .pw button:hover { background: var(--peach); }
    .row-between { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 15px; }
    .check { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    .check input { appearance: none; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #CFC7C2; display: grid; place-items: center; transition: background .2s, border-color .2s; margin: 0; }
    .check input:checked { background: var(--orange); border-color: var(--orange); }
    .check input:checked::after { content: ''; width: 10px; height: 6px; border: 2.4px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
    .forgot { font-weight: 700; color: var(--purple); }
    .forgot:hover { color: var(--orange); }
    .login-form .btn { justify-content: space-between; width: 100%; margin-top: 6px; }
    .help { margin-top: 26px; font-size: 15px; color: var(--ink-2); }
    .help a { color: var(--orange); text-decoration: underline; text-underline-offset: 3px; }
    .stagger > * { animation: viewIn .8s var(--ease-out) both; }
    .stagger > *:nth-child(2) { animation-delay: .06s; } .stagger > *:nth-child(3) { animation-delay: .12s; }
    .stagger > *:nth-child(4) { animation-delay: .18s; } .stagger > *:nth-child(5) { animation-delay: .24s; }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .login-art { min-height: 280px; order: 2; }
    }
  </style>
</head>
<body>
  <aside class="login-art" aria-hidden="false">
    <div class="hero-bg"></div>
    <div class="hero-grain"></div>
    <div class="hero-scene" aria-hidden="true">
      <div class="layer" data-depth="18">
        <span class="disc float" style="width:min(30vw,360px);height:min(30vw,360px);left:30%;top:18%;--dur:10s"></span>
        <span class="disc glass float" style="width:180px;height:180px;left:62%;top:46%;--dur:7s;--dy:22px"></span>
      </div>
      <div class="layer" data-depth="40">
        <span class="capsule" style="width:200px;height:72px;left:12%;top:58%;rotate:-28deg"></span>
        <span class="disc glass float" style="width:80px;height:80px;left:22%;top:20%;--dur:5s"></span>
      </div>
    </div>
    <a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Volver a chinoin.com</a>
    <div>
      <h2>Portal <em>Médico</em></h2>
    </div>
  </aside>

  <main class="login-panel">
    <a href="index.html"><img class="logo" src="assets/chinoin-logo.png" alt="CHINOIN®" width="900" height="176"></a>
    <div class="stagger">
      <h1>Iniciar sesión</h1>
      <p class="intro">La página que estás intentando visualizar solo está disponible para usuarios registrados.</p>
      <form class="login-form" id="login" novalidate>
        <div class="field">
          <label for="email">Correo*</label>
          <input id="email" type="email" placeholder="Correo" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña*</label>
          <div class="pw">
            <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="button" aria-controls="password" aria-pressed="false">Mostrar</button>
          </div>
        </div>
        <div class="row-between">
          <label class="check"><input type="checkbox" checked> Recordarme</label>
          <a class="forgot" href="#">¿Has olvidado la contraseña?</a>
        </div>
        <button class="btn" type="submit">Iniciar sesión <span class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
      </form>
      <p class="help">¿Tienes problemas? <a href="#">Ponte en contacto con el administrador del sitio</a></p>
    </div>
  </main>

  <script>
    (() => {
      const btn = document.querySelector('.pw button');
      const pw = document.getElementById('password');
      btn.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        btn.textContent = show ? 'Ocultar' : 'Mostrar';
        btn.setAttribute('aria-pressed', String(show));
      });
      // Maqueta: el formulario se conectará al mismo inicio de sesión que usa chinoin.com.
      document.getElementById('login').addEventListener('submit', (e) => e.preventDefault());

      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const art = document.querySelector('.login-art');
      const layers = art.querySelectorAll('.layer');
      art.addEventListener('pointermove', (e) => {
        const r = art.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
        layers.forEach((l) => { const d = +l.dataset.depth; l.style.transform = `translate3d(${-x * d}px, ${-y * d}px, 0)`; });
      });
    })();
  </script>
</body>
</html>
